name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.13.0, 24.19.0]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonicalize Windows test temporary directory
        if: runner.os == 'Windows'
        run: >-
          node --input-type=module -e "import { appendFileSync, realpathSync } from 'node:fs'; import { tmpdir } from 'node:os'; const temp = realpathSync.native(tmpdir()); appendFileSync(process.env.GITHUB_ENV, 'TEMP=' + temp + '\nTMP=' + temp + '\n');"

      - name: Run quality gate
        run: pnpm check

      - name: Exercise bundled action
        if: matrix.node == '24.19.0'
        uses: ./
        with:
          target: test/fixtures/safe-server
          output: dist/action-smoke/uleravo.json
          sarif-output: dist/action-smoke/uleravo.sarif
          fail-on: high

      - name: Exercise default observation on findings
        if: matrix.node == '24.19.0'
        uses: ./
        with:
          target: test/fixtures/vulnerable-server
          output: dist/action-observation-smoke/uleravo.json
          sarif-output: dist/action-observation-smoke/uleravo.sarif

      - name: Scan production source
        run: pnpm scan:self --format sarif --output uleravo.sarif

      - name: Preserve scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uleravo-sarif-${{ matrix.os }}-node-${{ matrix.node }}
          path: uleravo.sarif
          if-no-files-found: ignore
          retention-days: 7
